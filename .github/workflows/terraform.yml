name: Terraform Deploy

on:
  push:
    branches:
      - main
      - master

env:
  AWS_REGION: us-east-1
  TF_VAR_upload_bucket_name: ${{ secrets.UPLOAD_BUCKET_NAME }}
  AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
  TF_VAR_aws_region: us-east-1

jobs:
  terraform:
    name: Terraform Apply
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: infra/terraform

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.6

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform Init
        run: terraform init -reconfigure

      # - name: Import Existing Resources
      #   run: |
      #     terraform import aws_iam_role.presign_lambda_role \
      #       DevOps-Accelerator-Presign-Lambda-Role
      
      #     terraform import aws_iam_policy.presign_lambda_policy \
      #       arn:aws:iam::${{ steps.aws-account.outputs.account_id }}:policy/DevOps-Accelerator-Presign-Lambda-Policy
      
      #     terraform import aws_iam_policy.devops_accelerator_lambda_sns_policy \
      #       arn:aws:iam::${{ steps.aws-account.outputs.account_id }}:policy/devops-accelerator-lambda-sns-publish-policy
      
      #     terraform import aws_cloudwatch_log_group.apigw_logs \
      #       /aws/apigateway/presign-api
      - name: Check AWS Identity
        run: |
          aws sts get-caller-identity
      - name: Terraform Format Check
        run: terraform fmt -check
      - name: Terraform State Debug
        run: |
          echo "Terraform workspace:"
          terraform workspace show
      
          echo "Terraform state:"
          terraform state list
      
          echo "Checking lambda role:"
          terraform state show aws_iam_role.lambda_exec_role
      # - name: Import Existing Resources (idempotent)
      #   run: |
      #       import_if_missing() {
      #         terraform state show "$1" >/dev/null 2>&1 || terraform import "$1" "$2"
      #       }
      #       import_if_missing aws_iam_role.presign_lambda_role DevOps-Accelerator-Presign-Lambda-Role
      #       import_if_missing aws_iam_policy.presign_lambda_policy arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:policy/DevOps-Accelerator-Presign-Lambda-Policy
      #       import_if_missing aws_iam_policy.devops_accelerator_lambda_sns_policy arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:policy/devops-accelerator-lambda-sns-publish-policy
      #       import_if_missing aws_cloudwatch_log_group.apigw_logs /aws/apigateway/presign-api   
      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan

      - name: Terraform Apply
        env:
          GZIP: "false"
        run: terraform apply -auto-approve
